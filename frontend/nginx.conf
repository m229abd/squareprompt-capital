resolver 127.0.0.11 valid=5s ipv6=off;
upstream research_api {
 zone research_api 64k;
 server api:8000 resolve;
}
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 location /api/ { proxy_pass http://research_api; proxy_connect_timeout 3s; proxy_read_timeout 120s; }
 location / { try_files $uri $uri/ /index.html; }
}
